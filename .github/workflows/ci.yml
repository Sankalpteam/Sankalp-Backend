name: Backend CI

on:
  push:
    branches:
      - develop
      - main
      - "feat/open-source-langgraph-redesign-*"
  pull_request:
    branches:
      - main
      - "fix/gemini-groq-tools-safe-cleanup-*"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app tests scripts

      # Nothing is excluded any more. The last three exclusions were tests whose subject
      # had been removed from the code: a _memory_service in app/api/chat.py, and a
      # research provider and a knowledge base inside app/ai/service.py. All three are
      # gone, and the behaviour they were meant to cover - memory reaching the model - is
      # covered by the agent suite.
      - name: Run tests
        run: python -m pytest -q -W error

      - name: Measure LangGraph process RSS on GitHub runner (not AWS)
        run: python -m scripts.ops.profile_langgraph_memory

      - name: Run production security smoke test
        run: python scripts/ops/security_smoke.py
  # The state store runs on SQLite by default and on Postgres when
  # INDOONE_DATABASE_URL says so. The SQLite tests run in the job above; this job
  # proves the same store on a real Postgres, which is the point of the seam.
  postgres-store:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: indoone
          POSTGRES_PASSWORD: indoone
          POSTGRES_DB: indoone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      INDOONE_TEST_DATABASE_URL: postgresql://indoone:indoone@localhost:5432/indoone_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run the stores against Postgres
        run: >
          python -m pytest -q
          tests/capabilities/connectors/test_database_postgres.py
          tests/ai/memory/test_conversation_store_postgres.py

  # Optional Composio SDK compatibility, on GitHub-hosted CI only.
  # This installs NO package on the single production AWS 2 GiB instance.
  composio-sdk:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/open-source-langgraph-redesign-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install official optional SDK
        run: python -m pip install -r requirements-composio.txt
      - name: Validate installed SDK dependency consistency
        run: python -m pip check
      - name: Import and measure official Composio SDK (CI only)
        run: python -m scripts.ops.profile_composio_sdk
